
name: Build AWAPART66 APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

     - name: Set up Android SDK
  uses: android-actions/setup-android@v4
  with:
    accept-android-sdk-licenses: true
    log-accepted-android-sdk-licenses: false
    packages: platform-tools

      - name: Install Android platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Extract Android project
        run: |
          ZIP_FILE=$(find . -maxdepth 1 -type f -iname '*.zip' | head -n 1)
          test -n "$ZIP_FILE"
          mkdir -p source
          unzip -q "$ZIP_FILE" -d source
          test -f source/AWAPART66-Android/settings.gradle

      - name: Build APK
        working-directory: source/AWAPART66-Android
        run: gradle --no-daemon :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AWAPART66-debug-apk
          path: source/AWAPART66-Android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
