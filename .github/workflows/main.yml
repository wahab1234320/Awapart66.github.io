name: Build AWAPART 66 APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''

      - name: Install Android SDK packages
        run: |
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0"
          sdkmanager --list_installed

      - name: Extract fixed Android project
        run: |
          ZIP_FILE="AWAPART66-Android-JVM17-FIX.zip"
          test -f "$ZIP_FILE" || { echo "File $ZIP_FILE tidak ditemukan di root repository"; exit 1; }
          unzip -o "$ZIP_FILE" -d extracted-project
          test -f extracted-project/AWAPART66-Android/app/build.gradle
          test -f extracted-project/AWAPART66-Android/settings.gradle

      - name: Build debug APK
        run: gradle --no-daemon -p extracted-project/AWAPART66-Android :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AWAPART66-debug-apk
          path: extracted-project/AWAPART66-Android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
